name: Refresh data

# Pulls new messages from the Discord channel, rebuilds the dataset and site
# data (scripts/export_discord.sh) and opens a pull request with the result.
# It never pushes to the default branch.
on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID || '986617857133649921' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check for DISCORD_TOKEN secret
        run: |
          if [ -z "$DISCORD_TOKEN" ]; then
            echo "::error::Repository secret DISCORD_TOKEN is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run export + rebuild
        run: bash scripts/export_discord.sh

      - name: Open pull request with refreshed data
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes — nothing to propose."
            exit 0
          fi
          branch="automation/data-refresh-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A rejected_sites.csv progress.json final_links.csv final_links.json \
            dead_links.csv site/data.json .last_export_checkpoint
          git commit -m "chore: refresh link data"
          git push origin "$branch"
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "chore: refresh link data ($(date -u +%Y-%m-%d))" \
            --body "Automated refresh generated by \`scripts/export_discord.sh\` (workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Review the dataset diff and merge to publish the updated site data."
